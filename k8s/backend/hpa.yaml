apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planit-backend-hpa
  namespace: planit-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planit-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60