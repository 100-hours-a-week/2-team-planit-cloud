apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planit-backend-hpa
  namespace: planit-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planit-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60