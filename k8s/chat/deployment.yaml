# 채팅 서버 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-chat
  namespace: planit-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planit-chat
  template:
    metadata:
      labels:
        app: planit-chat
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: planit-chat
      containers:
        - name: chat
          image: 713881824287.dkr.ecr.ap-northeast-2.amazonaws.com/planit-was:prod
          ports:
            - containerPort: 8080 
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            failureThreshold: 10
          # backend secret과 통일하여 사용
          envFrom:
            - secretRef:
                name: planit-backend-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: TZ
              value: "Asia/Seoul"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              cpu: "600m"
              memory: "1024Mi"
            limits:
              cpu: "600m"
              memory: "1024Mi"