apiVersion: v1
kind: Secret
metadata:
  name: planit-ai-secret
  namespace: planit-app
type: Opaque
stringData:
  # 호환을 위해 "소문자(필드명)" + "대문자(.env 관례)" 둘 다 제공합니다.
  HOST: "0.0.0.0"
  PORT: "8000"
  host: "0.0.0.0"
  port: "8000"

  LLM_CLIENT_TIMEOUT: "30"
  LLM_CLIENT_MAX_RETRIES: "3"
  VLLM_CLIENT_MAX_TOKENS: "2048"
  LLM_CLIENT_TEMPERATURE: "0.7"
  LLM_CLIENT_TOP_P: "0.9"
  llm_client_timeout: "30"
  llm_client_max_retries: "3"
  vllm_client_max_tokens: "2048"
  llm_client_temperature: "0.7"
  llm_client_top_p: "0.9"

  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "REPLACE_ME"
  openai_base_url: "https://api.openai.com/v1"
  openai_model: "REPLACE_ME"

  VLLM_BASE_URL: "REPLACE_ME"
  VLLM_MODEL: "REPLACE_ME"
  vllm_base_url: "REPLACE_ME"
  vllm_model: "REPLACE_ME"

  # 외부 API 키/자격증명 (예시 값)
  OPENAI_API_KEY: "REPLACE_ME"
  GOOGLE_MAPS_API_KEY: "REPLACE_ME"
  TAVILY_API_KEY: "REPLACE_ME"
  LANGEXTRACT_API_KEY: "REPLACE_ME"
  openai_api_key: "REPLACE_ME"
  google_maps_api_key: "REPLACE_ME"
  tavily_api_key: "REPLACE_ME"
  langextract_api_key: "REPLACE_ME"

  # 인프라 연결 문자열 (예시 값)
  MONGODB_URI: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  mongodb_uri: "REPLACE_ME"
  redis_url: "REPLACE_ME"
