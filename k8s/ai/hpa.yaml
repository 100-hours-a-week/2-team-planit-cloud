# AI API HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planit-ai-hpa
  namespace: planit-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planit-ai
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
