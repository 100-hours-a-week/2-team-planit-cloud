# AI API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-ai
  namespace: planit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: planit-ai
  template:
    metadata:
      labels:
        app: planit-ai
    spec:
      containers:
        - name: ai
          image: 713881824287.dkr.ecr.ap-northeast-2.amazonaws.com/planit-ai:prod
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 800m
              memory: 800Mi
            limits:
              cpu: 800m
              memory: 800Mi
          # 임시 Probe 설정
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      # Pod Anti-Affinity: 동일 서비스 파드가 서로 다른 노드로 분산되도록 선호
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: planit-ai
                topologyKey: kubernetes.io/hostname
            # Workload Anti-Affinity(상성 격리): chat 파드와 같은 노드 배치 회피(선호)
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: planit-chat
                topologyKey: kubernetes.io/hostname
      # Topology Spread: AZ/노드 균형 분산
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: planit-ai
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: planit-ai
